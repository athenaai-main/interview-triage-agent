[project]
name = "triage-agent"
version = "0.1.0"
description = "Transaction triage agent"
requires-python = ">=3.11"
dependencies = [
    "google-genai==1.46.0",
    "mcp==2.0.0",
    "fastapi==0.121.2",
    "uvicorn==0.40.0",
    "httpx==0.28.1",
    "pytest==8.4.2",
]

[project.scripts]
triage = "triage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
